name: Unity-Lizenz anfordern (.alf)

# Erzeugt die Aktivierungsdatei OHNE Unity auf dem eigenen Rechner.
# Nötig genau einmal, danach kann die CI bauen.
#
# Ablauf:
#   1. Actions → "Unity-Lizenz anfordern (.alf)" → Run workflow
#   2. Artefakt "Unity_v2022.x.alf" herunterladen und entpacken
#   3. Datei auf https://license.unity3d.com/manual hochladen
#      (Unity-Konto anlegen, "Unity Personal" wählen)
#   4. Die zurückgegebene .ulf-Datei in einem Texteditor öffnen,
#      GESAMTEN Inhalt kopieren
#   5. Repo → Settings → Secrets and variables → Actions → New secret
#      Name: UNITY_LICENSE   Wert: der kopierte Inhalt
#
# Danach kann dieser Workflow gelöscht werden.

on:
  workflow_dispatch:

jobs:
  activation:
    name: Aktivierungsdatei erzeugen
    runs-on: ubuntu-latest
    steps:
      - name: Aktivierungsdatei anfordern
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 2022.3.62f1

      - name: Als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.getManualLicenseFile.outputs.filePath }}
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
