name: WebGL bauen und auf GitHub Pages veröffentlichen

# Baut das Spiel als WebGL-Version und stellt sie unter
#   https://<benutzer>.github.io/penner-kombat/
# bereit — spielbar im Browser, auf jedem halbwegs aktuellen Gerät,
# ohne Installation, ohne APK, ohne Unity auf dem eigenen Rechner.
#
# Voraussetzung: Secret UNITY_LICENSE (siehe docs/ci/README.md),
# und einmalig: Settings → Pages → Source = "GitHub Actions".

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: WebGL bauen
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Library-Cache
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - name: Platz schaffen
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Unity-Build (WebGL)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          allowDirtyBuild: true
          buildName: PennerKombat

      - name: Pages-Artefakt vorbereiten
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/PennerKombat

  deploy:
    name: Veröffentlichen
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
