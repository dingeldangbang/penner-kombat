; Penner Kombat — Android-Export-Presets (Godot 4.7, Android 11–15 / API 30–35)
;
; preset.0 "Android"      → Debug-APK über das mitgelieferte Prebuilt-Template.
;                           Läuft ohne Gradle/SDK-36/NDK (CI-tauglich).
;                           minSdk/targetSdk des APK stammen aus dem Godot-4.7-Template
;                           (minSdk 24, targetSdk 36) → deckt Android 11–16 ab.
; preset.1 "Android AAB"  → Google-Play-AAB über den Gradle-Build.
;                           minSdk 30 / targetSdk 35 (Android 11–15) werden hier
;                           explizit gesetzt. Benötigt installiertes Android-Build-
;                           Template (Tools/install_android_build_template.sh) sowie
;                           SDK Platform 36, Build-Tools 36.1.0, NDK r29, JDK 17.

[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features="mobile"
export_filter="all_resources"
include_filter="*.glb,*.gltf"
exclude_filter=""
export_path="build/PennerKombat-debug.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

gradle_build/use_gradle_build=false
; 16-KB-Page-Size-kompatibel (Google Play, Android 15+): Librearies unkomprimiert lassen.
gradle_build/compress_native_libraries=false
gradle_build/export_format=0
; min/target-SDK-Werte können nur beim Gradle-Build überschrieben werden —
; das Prebuilt-Template-APK übernimmt minSdk 24 / targetSdk 36 aus dem
; Godot-4.7.2-Template (deckt Android 11–16 ab).
gradle_build/min_sdk=""
gradle_build/target_sdk=""
gradle_build/gradle_build_directory=""
gradle_build/android_source_template=""
gradle_build/custom_theme_attributes={}
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="1.1.0"
package/unique_name="com.pennerkombat.mobile"
package/name="PennerKombat"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
package/show_as_launcher_app=false
launcher_icons/main_192x192=""
launcher_icons/adaptive_foreground_432x432=""
launcher_icons/adaptive_background_432x432=""
launcher_icons/adaptive_monochrome_432x432=""
graphics/opengl_debug=false
shader_baker/enabled=false
xr_features/xr_mode=0
gesture/swipe_to_dismiss=false
; Immersive Vollbild: Systemleisten automatisch ausblenden — das ist zugleich die
; empfohlene Behandlung der Android-15-Edge-to-Edge-Pflicht für Spiele.
screen/immersive_mode=true
screen/edge_to_edge=false
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
screen/background_color=Color(0, 0, 0, 0)
user_data_backup/allow=false
command_line/extra_args=""
permissions/custom_permissions=PackedStringArray()
permissions/internet=true
permissions/access_network_state=true
permissions/vibrate=true
permissions/wake_lock=true

