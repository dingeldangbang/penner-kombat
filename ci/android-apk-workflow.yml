name: Game CI — Android APK

# Exports the Godot 4.7 project as an installable, debug-signed Android APK
# (Android 11–15 / API 30–35) and, on request, a Play-Store-ready AAB via
# the Gradle build. On version tags (v*) a **signed APK is published as a
# GitHub Release asset** (release keystore from secrets, debug fallback).
# Optional: installs the APK on an Android 11–15 emulator (API 30–35).
#
# The barichello/godot-ci:4.7.2 image contains Godot 4.7.2, matching export
# templates, Android SDK build-tools, JDK 17 and the debug keystore, so no
# repository secrets are needed for the APK. The optional AAB job installs the
# missing SDK platform/build-tools/NDK r29 components on the fly.
#
# Everything can be driven from the local machine via GitHub CLI:
#   ./Tools/gh_android.sh build apk|aab|all
#   ./Tools/gh_android.sh emulator 35
#   ./Tools/gh_android.sh release v1.0.0   # → signierte APK im GitHub Release

on:
  workflow_dispatch:
    inputs:
      build_aab:
        description: "Also export a debug-signed Android App Bundle (AAB, needs ~10 min extra)"
        required: true
        default: false
        type: boolean
      emulator_test:
        description: "Install the APK on an Android emulator and smoke-test the launch"
        required: true
        default: false
        type: boolean
      emulator_api:
        description: "Emulator API level (30=Android 11 … 35=Android 15)"
        required: true
        default: "30"
        type: choice
        options:
          - "30"
          - "31"
          - "33"
          - "34"
          - "35"
  push:
    branches:
      - main
      - arena/**
    tags:
      - "v*"
    paths:
      - "android/**"
      - "scenes/**"
      - "scripts/**"
      - "shaders/**"
      - "translations/**"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/android-apk.yml"
      - "ci/android-apk-workflow.yml"
  pull_request:
    paths:
      - "android/**"
      - "scenes/**"
      - "scripts/**"
      - "shaders/**"
      - "translations/**"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/android-apk.yml"
      - "ci/android-apk-workflow.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-apk:
    name: Export Android APK (API 30–35)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: barichello/godot-ci:4.7.2
    # godot-ci legt Templates/Editor-Settings/Keystore unter /root ab; der
    # Container-Job setzt HOME=/github/home → ohne diesen Wert findet Godot
    # weder Export-Templates noch Java-SDK-Pfad.
    env:
      HOME: /root

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Import first. This makes the export deterministic and surfaces invalid
      # scenes/scripts before the APK export begins.
      - name: Import project resources
        run: godot --headless --path "$GITHUB_WORKSPACE" --editor --quit

      - name: Export debug APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
          godot --headless --path "$GITHUB_WORKSPACE" \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/PennerKombat-debug.apk"
          test -s "$GITHUB_WORKSPACE/build/PennerKombat-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PennerKombat-Android-debug-${{ github.run_number }}
          path: build/PennerKombat-debug.apk
          if-no-files-found: error
          retention-days: 30

  # Optional (workflow_dispatch → "build_aab"): Google-Play-Bundle.
  # Installs the Gradle build template, SDK Platform 36, Build-Tools 36.1.0 and
  # NDK r29 (as required by Godot 4.7's config.gradle).
  export-aab:
    name: Export Android AAB (optional)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_aab == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: barichello/godot-ci:4.7.2
    env:
      HOME: /root

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install SDK Platform 36 / Build-Tools / NDK r29
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "build-tools;36.1.0" \
            "platforms;android-36" \
            "ndk;29.0.14206865"

      - name: Install Android Gradle build template
        run: ./Tools/install_android_build_template.sh

      - name: Import project resources
        run: godot --headless --path "$GITHUB_WORKSPACE" --editor --quit

      - name: Export debug AAB
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
          godot --headless --path "$GITHUB_WORKSPACE" \
            --export-debug "Android AAB" \
            "$GITHUB_WORKSPACE/build/PennerKombat-debug.aab"
          test -s "$GITHUB_WORKSPACE/build/PennerKombat-debug.aab"

      - name: Upload AAB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PennerKombat-Android-debug-aab-${{ github.run_number }}
          path: build/PennerKombat-debug.aab
          if-no-files-found: error
          retention-days: 30

  # Tag-Pipeline (v*): signierte Release-APK → GitHub Release als Download-Asset.
  # Signierung:
  #   - Secrets ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PASSWORD + ANDROID_KEY_ALIAS
  #     gesetzt → echter Release-Keystore (Godot exportiert --export-release).
  #   - Nicht gesetzt → Debug-Signatur (Keystore im CI-Image, Warnung im Log).
  release-apk:
    name: Signed APK → GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: barichello/godot-ci:4.7.2
    # Für `gh release create/upload` (Asset anhängen) braucht dieser Job
    # Schreibrechte auf Contents — überschreibt das Top-Level-`read`.
    permissions:
      contents: write
    env:
      HOME: /root

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Import project resources
        run: godot --headless --path "$GITHUB_WORKSPACE" --editor --quit

      - name: Export signed release APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build"
          if [ -n "$KEYSTORE_B64" ]; then
            if [ -z "$KEYSTORE_PASS" ] || [ -z "$KEY_ALIAS" ]; then
              echo "::error::Secrets unvollständig: ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PASSWORD + ANDROID_KEY_ALIAS müssen zusammen gesetzt sein." >&2
              exit 1
            fi
            echo "$KEYSTORE_B64" | base64 -d > /tmp/pennerkombat-release.keystore
            export GODOT_ANDROID_KEYSTORE_RELEASE_PATH=/tmp/pennerkombat-release.keystore
            export GODOT_ANDROID_KEYSTORE_RELEASE_USER="$KEY_ALIAS"
            export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$KEYSTORE_PASS"
            echo "Signiere mit Release-Keystore (Alias `$KEY_ALIAS`) …"
            godot --headless --path "$GITHUB_WORKSPACE" \
              --export-release "Android" \
              "$GITHUB_WORKSPACE/build/PennerKombat-release.apk"
          else
            echo "::warning::Keine Release-Keystore-Secrets gesetzt — veröffentliche debug-signierte APK (Test/Installation)."
            echo "            Echte Signatur: gh secret set ANDROID_KEYSTORE_BASE64/… — siehe docs/APK_BUILD_READY.md"
            godot --headless --path "$GITHUB_WORKSPACE" \
              --export-debug "Android" \
              "$GITHUB_WORKSPACE/build/PennerKombat-release.apk"
          fi
          test -s "$GITHUB_WORKSPACE/build/PennerKombat-release.apk"

      - name: Create/update GitHub Release and attach APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          APK="$GITHUB_WORKSPACE/build/PennerKombat-release.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            echo "Release $TAG existierte bereits — APK aktualisiert."
          else
            gh release create "$TAG" "$APK" \
              --title "Penner Kombat $TAG" \
              --generate-notes
          fi
          gh release view "$TAG" --json name,tagName,assets \
            --jq '"✅ Release \(.tagName) — Assets: " + ([.assets[].name] | join(", "))'

  # Optional (workflow_dispatch → "emulator_test"): installs the APK on an
  # Android 11–15 emulator (API 30–35) and verifies it launches.
  emulator-smoke-test:
    name: Emulator smoke test (API 30–35)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.emulator_test == 'true'
    needs: export-apk
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: PennerKombat-Android-debug-${{ github.run_number }}
          path: build

      - name: Start emulator + smoke test
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # GitHub-Hosted-Runner ohne KVM: fürs Booten "default"-Image + Soft-Accel
          # und längeres Timeout; verlässliche Gerätetests → Firebase Test Lab.
          api-level: ${{ github.event.inputs.emulator_api || '30' }}
          arch: x86_64
          disable-linux-hw-accel: true
          emulator-boot-timeout: "900"
          disable-animations: true
          script: |
            adb install -r build/PennerKombat-debug.apk
            adb shell pm list packages | grep -q com.pennerkombat.mobile
            echo "✅ Paket installiert (API ${{ github.event.inputs.emulator_api }})"
            adb shell monkey -p com.pennerkombat.mobile -c android.intent.category.LAUNCHER 1 >/dev/null
            sleep 10
            if adb shell pidof com.pennerkombat.mobile >/dev/null; then
              echo "✅ App läuft auf Android API ${{ github.event.inputs.emulator_api }}"
            else
              echo "❌ App-Prozess nicht gefunden" >&2
              adb logcat -d -t 200 | tail -n 200
              exit 1
            fi
