name: Android-APK bauen

# Baut ein installierbares APK mit game-ci/unity-builder.
# Voraussetzung: die drei Secrets unten (siehe docs/ci/README.md).
#
# Auslöser:
#   • manuell über Actions → "Android-APK bauen" → Run workflow
#   • automatisch bei jedem Tag v*.*.*  (APK wird ans Release gehängt)

on:
  workflow_dispatch:
    inputs:
      buildType:
        description: "Development-Build (mit Profiler/Logs)?"
        type: boolean
        default: false
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: APK bauen
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Library-Cache
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Platz auf dem Runner schaffen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc
          df -h

      - name: Unity-Build (Android)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          androidExportType: androidPackage      # androidPackage = .apk, androidAppBundle = .aab
          allowDirtyBuild: true
          buildName: PennerKombat
          customParameters: -disable-assembly-updater
          # Signierung (optional, für Play Store nötig):
          # androidKeystoreName: pennerkombat.keystore
          # androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          # androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          # androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          # androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: PennerKombat-Android
          path: build/Android
          retention-days: 30

      - name: APK ans Release hängen (nur bei Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find build/Android -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "Kein APK gefunden – Build prüfen."
            exit 1
          fi
          gh release upload "${GITHUB_REF_NAME}" "$APK" --clobber
